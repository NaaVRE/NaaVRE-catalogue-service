name: naavre-catalogue-service-dev

services:
  db:
    image: postgres:17
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: fake-postgres-password


  s3:
    image: chrislusf/seaweedfs:4.52
    network_mode: host
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - s3.env
    entrypoint: ["sh", "-e", "/s3-entrypoint.sh"]
    volumes:
      - ./s3-entrypoint.sh:/s3-entrypoint.sh:ro
    healthcheck:
      # Healthy once the S3 API is up and the bucket has been created
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/healthz && curl -fs -o /dev/null http://127.0.0.1:9002/buckets/$${BUCKET_NAME}/"]
      interval: 5s
      timeout: 5s
      retries: 5
